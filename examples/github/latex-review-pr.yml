# 复制到论文仓库的 .github/workflows/ 后才启用；先替换下列工具提交与入口。
name: LaTeX Review PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-latest
    steps:
      - name: 获取固定版本的审阅工具
        uses: actions/checkout@v4
        with:
          repository: jinghonh/LaTeX-Review
          ref: REPLACE_WITH_TRUSTED_TOOL_COMMIT
          path: tool
          persist-credentials: false
      - name: 获取请求版本的论文
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: paper
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定版本的审阅工具
        run: python -m pip install ./tool
      - name: 生成报告与状态
        id: review
        env:
          OLD_SHA: ${{ github.event.pull_request.base.sha }}
          NEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m latex_review.ci \
            --paper-dir paper --entry main.tex \
            --old "$OLD_SHA" --new "$NEW_SHA" \
            --report-dir "$GITHUB_WORKSPACE/review-output" \
            --status-file "$GITHUB_WORKSPACE/review-status/status.json"
      - name: 上传报告目录和机器数据
        id: report_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-review-report
          path: review-output/
          if-no-files-found: ignore
          retention-days: 14
      - name: 上传状态数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-review-status
          path: review-status/status.json
          if-no-files-found: error
          retention-days: 14
      - name: 保留审阅失败状态
        if: always()
        env:
          REVIEW_CODE: ${{ steps.review.outputs.exit_code }}
          REPORT_AVAILABLE: ${{ steps.review.outputs.report_available }}
        run: |
          if [ "$REVIEW_CODE" = 0 ] && [ "$REPORT_AVAILABLE" = true ]; then exit 0; fi
          echo "审阅未生成完整报告，退出码 ${REVIEW_CODE:-未知}；已上传可用产物。" >&2
          exit 1
