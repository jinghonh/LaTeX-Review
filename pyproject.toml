[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-review"
version = "0.1.0"
description = "LaTeX 论文结构化审阅工具（工程骨架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5", "plasTeX>=3.1,<4", "watchfiles>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.45,<2", "psutil>=5.9"]

[project.scripts]
latex-review = "latex_review.cli:main"
latex-review-live = "latex_review.live:main"
latex-review-preview = "latex_review.serve:main"
latex-review-local = "latex_review.local_service:main"
latex-review-annotations = "latex_review.agent_tools:annotations_main"
latex-review-query = "latex_review.agent_tools:query_main"
latex-review-check-scope = "latex_review.agent_tools:scope_main"
latex-review-record-acceptance = "latex_review.agent_tools:acceptance_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latex_review = ["schemas/*.json", "report_interaction.js", "report_annotations.js", "annotation_delivery.js", "report_reader.js", "report_search.js", "report_sections.js", "report_translation.js", "report.css", "live_reader.js", "local_dashboard.html", "local_report.html", "math_render.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
