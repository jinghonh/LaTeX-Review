<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>登录 · LaTeX Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23205c49'/%3E%3Cpath d='M12 10v20h16' fill='none' stroke='%23f4f0e7' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--paper:#f4f0e7;--ink:#22332c;--muted:#718078;--green:#205c49;--line:#d5d9cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}main{min-height:100svh;display:grid;grid-template-columns:1.15fr 1fr}.story{padding:56px clamp(32px,6vw,96px);background:var(--green);color:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}.brand{display:flex;gap:12px;align-items:center;font:15px Georgia,serif;letter-spacing:.05em}.logo{width:34px;height:34px;border:1px solid #f4f0e755;display:grid;place-items:center;font:22px Georgia,serif}.intro{margin:auto 0;position:relative;z-index:1;padding:64px 0}.eyebrow{font:11px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.6}.story h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(40px,4.5vw,66px);font-weight:500;line-height:1.35;letter-spacing:-.035em;margin:22px 0}.story p{max-width:330px;font-size:14px;line-height:1.9;color:#d0ded4}.folio{position:absolute;right:-84px;bottom:24px;width:290px;height:360px;border:1px solid #b4d0bb26;transform:rotate(-16deg);pointer-events:none}.folio:before,.folio:after{content:"";position:absolute;inset:-20px 20px 20px -20px;border:1px solid #b4d0bb26}.folio:after{inset:-40px 40px 40px -40px}.footnote{font:11px "Courier New",monospace;letter-spacing:.08em;color:#b4cebf;position:relative;z-index:1}.entry{display:flex;flex-direction:column;padding:56px clamp(28px,6vw,88px);min-width:0}.topnote{align-self:flex-end;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}.form-wrap{width:100%;max-width:360px;margin:auto;animation:arrive .5s ease both;padding:48px 0}.chapter{font:12px "Courier New",monospace;color:#9b7955;letter-spacing:.12em}.entry h2{font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:500;font-size:34px;margin:18px 0 10px}.description{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 34px}label{display:block;font-size:13px;margin-bottom:9px}input{width:100%;border:1px solid var(--line);border-radius:4px;padding:13px 14px;background:#fffdf7;color:var(--ink);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #205c4912}.field{margin-bottom:22px}.password{position:relative}.password input{padding-right:51px}.visibility{position:absolute;right:5px;top:5px;bottom:5px;width:40px;background:transparent;border:0;color:var(--muted);cursor:pointer;border-radius:3px;display:grid;place-items:center}.visibility:hover{color:var(--green)}.visibility svg{width:19px;height:19px}.submit{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:4px;background:var(--green);color:var(--paper);font-size:14px;padding:15px 18px;cursor:pointer;transition:background .15s,transform .15s;margin-top:30px}.submit:hover{background:#173f33}.submit:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #a67a49;outline-offset:4px}.error{font-size:13px;line-height:1.7;color:#9b4535;background:#f4e6de;border:1px solid #e7cbbf;border-radius:4px;padding:11px 13px;margin:0 0 24px}.error:empty{display:none}.hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin:18px 0 0}.bottom{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.form-wrap{animation:none}}@media(max-width:760px){main{grid-template-columns:1fr}.story{padding:28px 28px 34px}.intro{padding:32px 0 0}.story h1{font-size:34px;margin:14px 0}.story p{font-size:13px;max-width:none}.footnote{display:none}.folio{width:150px;height:210px;right:-50px;bottom:-55px}.entry{padding:26px 28px 28px}.form-wrap{padding:26px 0 38px;max-width:420px}.entry h2{font-size:30px}.description{margin-bottom:26px}.eyebrow{font-size:10px}.brand{font-size:14px}.topnote{font-size:11px}.bottom{max-width:420px;width:100%;margin:auto}}
</style>
</head>
<body><main>
<section class="story" aria-label="LaTeX Review"><div class="brand"><span class="logo" aria-hidden="true">L</span>LaTeX Review</div><div class="intro"><div class="eyebrow">Research / Revision / Reflection</div><h1>让每一次修改，<br>都有迹可循。</h1><p>在文字与公式之间，阅读论文的变化。<br>你的审阅报告，在这里有序归档。</p></div><div class="folio" aria-hidden="true"></div><div class="footnote">A PRIVATE SPACE FOR YOUR RESEARCH.</div></section>
<section class="entry"><div class="topnote"><span class="dot" aria-hidden="true"></span>私有审阅空间</div><div class="form-wrap"><div class="chapter">01 / ACCESS</div><h2>欢迎回来</h2><p class="description">登录后，选择论文并查看审阅报告。</p><p class="error" role="alert">{{ERROR}}</p><form action="/login" method="post"><input type="hidden" name="csrf" value="{{CSRF}}"><input type="hidden" name="next" value="{{NEXT}}"><div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="128" placeholder="输入账号" value="{{USERNAME}}" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="password">密码</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码"><button class="visibility" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button class="submit" type="submit"><span>进入审阅空间</span><span aria-hidden="true">↗</span></button><p class="hint">请使用报告管理员提供的账号和密码。</p></form></div><footer class="bottom"><span>LaTeX Review</span><span>论文修改 · 有序归档</span></footer></section>
</main><script>const toggle=document.querySelector('.visibility'),password=document.getElementById('password');toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.setAttribute('aria-label',show?'隐藏密码':'显示密码');toggle.setAttribute('aria-pressed',String(show));});</script></body></html>
