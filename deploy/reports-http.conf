# Bootstrap only: no report content is served over plaintext HTTP.
server {
    listen 80;
    server_name reports.gpare.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/latex-review-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
