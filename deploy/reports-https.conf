limit_req_zone $binary_remote_addr zone=latex_review_login:1m rate=10r/m;

server {
    listen 80;
    server_name reports.gpare.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/latex-review-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://reports.gpare.top$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name reports.gpare.top;
    root /srv/latex-review/site;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/reports.gpare.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.gpare.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:latex_review_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Preserve Origin on same-origin form submissions; omit cross-origin referrers.
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    location ~ /\. { return 404; }
    location = /login {
        limit_req zone=latex_review_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    access_log /www/wwwlogs/latex-review.access.log;
    error_log /www/wwwlogs/latex-review.error.log warn;
}
