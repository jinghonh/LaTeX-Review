<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaTeX Review · 本地论文</title>
<style>
:root{color-scheme:light dark;font-family:"Avenir Next","PingFang SC",sans-serif;background:#f4f3ef;color:#222827}body{max-width:1100px;margin:0 auto;padding:52px 24px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid #243d37;padding-bottom:24px}h1{font-family:"Iowan Old Style","Songti SC",serif;font-size:40px;margin:6px 0}.eyebrow{font-size:12px;letter-spacing:.13em;color:#546d65}p{line-height:1.6}.muted{color:#68746f}button,a.link{border:1px solid #82988e;background:transparent;color:inherit;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit;white-space:nowrap}a{color:#22614f}.paper{animation:appear .25s ease-out;margin:24px 0;background:#fff;border:1px solid #d6ddd5;border-radius:12px;padding:24px}.paper h2{margin:0 0 6px;font-size:22px}.path{font:12px ui-monospace,monospace;overflow-wrap:anywhere;color:#63706a}.slots{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.slot{border-top:1px solid #d8ded8;padding-top:14px}.slot h3{font-size:16px;margin:0 0 10px}.state{font-size:12px;padding:3px 8px;border-radius:20px;background:#e9eee9}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}.diagnostic{font-size:13px;color:#924a22;overflow-wrap:anywhere}details{margin-top:12px;font-size:12px}#notice{min-height:28px;color:#924a22}#empty{padding:50px 0}code{overflow-wrap:anywhere}@media(max-width:620px){body{padding:28px 16px}.slots{grid-template-columns:1fr}header{align-items:start;gap:16px}.paper{padding:18px}}@media(prefers-color-scheme:dark){:root{background:#17201d;color:#e5ece6}.paper{background:#202c27;border-color:#3a4b43}.path,.muted{color:#a5b8ab}a{color:#a1d7b5}.state{background:#354b3e}.slot{border-color:#405246}}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.paper{animation:none}}button:focus-visible,a:focus-visible{outline:3px solid #b98742;outline-offset:3px}</style></head><body><header><div><div class="eyebrow">LATEX REVIEW / LOCAL</div><h1>本地论文</h1><p class="muted">从一个入口打开持续预览和差异报告。</p></div><button id="refresh">刷新列表</button></header><p id="notice" role="status"></p><main id="papers"></main><section id="empty" hidden><h2>尚未注册论文</h2><p>在终端启动一次持续预览或打开已有报告，论文就会显示在这里。</p><code>latex-review-live path/to/main.tex</code></section><footer class="muted"><p>关闭此页面不会停止服务。使用论文卡片停止服务。</p></footer>
<script>
const token='__TOKEN__';const labels={ready:'运行中',stopped:'已停止',starting:'正在启动',updating:'正在更新',stopping:'正在停止',failed:'启动失败',blocked:'等待旧进程退出'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-LaTeX-Review-Token':token},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.message||'请求失败');return v}
async function action(id,kind,verb){try{const v=await api(`/api/v1/papers/${id}/${kind}/${verb}`,verb==='ensure'?{reuse_saved:true,request_id:crypto.randomUUID()}:{});document.querySelector('#notice').textContent=verb==='ensure'?'正在启动服务…':'正在停止服务…';if(v.operation_id){for(let i=0;i<1200;i++){const o=await api('/api/v1/operations/'+v.operation_id);if(['ready','failed','cancelled'].includes(o.state)){if(o.state!=='ready')throw Error(o.message||'操作失败');break}await new Promise(r=>setTimeout(r,250))}}document.querySelector('#notice').textContent=verb==='ensure'?'服务已启动。':'服务已停止。';await refresh()}catch(e){document.querySelector('#notice').textContent=e.message}}
async function refresh(){try{const value=await api('/api/v1/papers');const main=document.querySelector('#papers');main.replaceChildren();document.querySelector('#empty').hidden=value.papers.length>0;for(const p of value.papers){const card=el('article',undefined,'paper');card.append(el('h2',p.entry),el('div',p.root,'path'));const slots=el('div',undefined,'slots');for(const kind of ['live','diff']){const s=p.slots[kind]||{state:'stopped'};const box=el('section',undefined,'slot');box.append(el('h3',kind==='live'?'持续预览':'差异报告'),el('span',labels[s.state]||s.state,'state'));const actions=el('div',undefined,'actions');if(s.state==='ready'){const a=el('a','打开','link');a.href=new URL(s.url).pathname;a.target='_blank';a.rel='noopener';actions.append(a)}if(s.request&&s.state!=='ready'){const b=el('button','启动');b.onclick=()=>action(p.paper_id,kind,'ensure');actions.append(b)}if(['ready','starting','updating','blocked'].includes(s.state)){const b=el('button','停止');b.onclick=()=>action(p.paper_id,kind,'stop');actions.append(b)}box.append(actions);if(s.baselines&&s.baselines.old){const old=s.baselines.old;box.append(el('p',`比较基线：${old.kind} · ${old.identifier||''}`,'path'))}if(s.message)box.append(el('p',s.message,'diagnostic'));if(s.log){const d=el('details');d.append(el('summary','诊断信息'));d.append(el('p',`日志：${s.log}`,'path'));if(s.pid)d.append(el('p',`进程：${s.pid} · 端口：${s.port}`));d.append(el('p',`论文 ID：${p.paper_id}`,'path'));box.append(d)}slots.append(box)}card.append(slots);main.append(card)}}catch(e){document.querySelector('#notice').textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></body></html>
