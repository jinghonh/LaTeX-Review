            - button "查看第 85 处修改前后对比" [ref=f1e9222] [cursor=pointer]:
              - strong [ref=f1e9223]: Spectral output representation
              - text: This ablation compares the truncated support-function coefficients with direct regression of support samples or boundary points on the finite training grid.
            - text: For common evaluation, support samples are differentiated on the grid to reconstruct boundary points, whereas boundary points are projected onto their outward normals to recover support samples. Spectral prediction yields the lowest support error and boundary RMSE. Boundary-point regression marginally improves sampled HD, and support-sample regression gives the lowest sampled CVR; the spectral target therefore does not dominate every grid-based metric. Its additional benefit is a direction-continuous analytic decoder whose output dimension is independent of the evaluation grid.
