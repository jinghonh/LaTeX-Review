            - button "查看第 1 处修改前后对比" [ref=f1e36] [cursor=pointer]: Dynamic convex-set inference requires both accurate prediction and a representation that defines a valid convex body.
            - button "查看第 1 处修改前后对比" [ref=f1e37] [cursor=pointer]: We learn a causal map from observation histories to support-function spectra using the Geometry-Aware Causal Spectral Neural Operator (G-CSNO).
            - button "查看第 1 处修改前后对比" [ref=f1e38] [cursor=pointer]: A recurrent encoder summarizes the available history, a coefficient mixer predicts a shared spectrum, and a fixed differential decoder reconstructs continuous support fields and geometric images.
            - button "查看第 1 处修改前后对比" [ref=f1e39] [cursor=pointer]: Because an unconstrained spectrum need not define a support function, we introduce a planar convexity correction that selects a truncated spectrum and adjusts its constant Fourier mode.
