            - button "查看第 1 处修改前后对比" [ref=f1e41] [cursor=pointer]: We also bound the geometric displacement introduced by this correction and separate prediction, correction, and truncation errors.
            - button "查看第 1 处修改前后对比" [ref=f1e42] [cursor=pointer]: Two-dimensional synthetic benchmarks evaluate predictive accuracy against sequence and operator baselines.
            - button "查看第 1 处修改前后对比" [ref=f1e43] [cursor=pointer]: A confirmation study on 128 held-out systems with predictors trained under three random seeds finds zero sampled violations after correction and nearly unchanged planar reconstruction error; matched short-budget fine-tuning exposes instability in direct optimization through the hard correction.
            - button "查看第 1 处修改前后对比" [ref=f1e44] [cursor=pointer]: Experiments in dimensions three through five remain limited to smooth centrally symmetric shapes and do not inherit the planar guarantee.
            - button "查看第 1 处修改前后对比" [ref=f1e45] [cursor=pointer]: Reachable-set examples illustrate trajectory reconstruction, without a certified containment claim.
