              - text: ), tangential-gradient supervision (
              - emphasis [ref=f1e9235]: + derivative
              - text: ), and boundary-map supervision (
              - emphasis [ref=f1e9236]: Full model
              - text: ) according to Equation
              - link "eq:loss" [ref=f1e9237]:
                - /url: "#new-equation-ca8a48a6fdceb0d7"
              - text: .
            - text: Support supervision improves the geometric metrics moderately, while derivative and boundary supervision produce larger reductions in boundary RMSE, HD, and sampled CVR. The full composite objective gives the lowest boundary RMSE and sampled CVR among the objective variants.
