                  - generic [ref=f1e9214]: i
              - text: .
            - text: The latter two variants yield large errors. Concatenated history matches the mean coefficient error of the ordered encoder but has substantially larger variation across seeds, so the principal advantage of ordered encoding is training stability rather than a uniformly better mean.
